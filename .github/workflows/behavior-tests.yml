name: Behavior tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: behavior-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior-tests:
    name: behavior-${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [full, isolated, reverse]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      CUDA_VISIBLE_DEVICES: ""
      WANDB_MODE: disabled
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10.19"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install locked CPU dependencies
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip check

      - name: Verify CPU runtime
        run: python repro/verify_cpu_environment.py

      - name: Run behavior tests
        run: python repro/run_behavior_tests.py "${{ matrix.mode }}"

      - name: Verify repository cleanliness
        if: ${{ always() }}
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            echo "$status"
            exit 1
          fi

  distributed-cpu:
    name: distributed-cpu
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      CUDA_VISIBLE_DEVICES: ""
      WANDB_MODE: disabled
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10.19"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install locked CPU dependencies
        run: |
          python -m pip install --require-hashes -r requirements-ci.lock
          python -m pip check

      - name: Verify CPU runtime
        run: python repro/verify_cpu_environment.py

      - name: Run real two-rank Gloo behavior
        run: |
          python -m unittest tests.integration.test_distributed_control_plane
          python -m unittest tests.integration.test_schedulefree_distributed_mode

      - name: Verify repository cleanliness
        if: ${{ always() }}
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            echo "$status"
            exit 1
          fi
